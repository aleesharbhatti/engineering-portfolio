<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Page skeleton only: text, links and images come from content.json, styling from styles.css, rendering from script.js. -->

  <header class="navbar container">
    <div class="logo" id="logo"></div>
    <nav>
      <ul id="nav-links"></ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero" id="about">
      <div class="hero-header-wrapper">
        <img id="headshot" class="headshot-img">
        <div>
          <div class="hero-badge" id="hero-badge"></div>
        </div>
      </div>

      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-title" id="hero-title"></p>
      <p class="hero-subtitle" id="hero-intro"></p>
      <div class="hero-actions" id="hero-actions"></div>
      <div class="stats-grid" id="stats"></div>
    </section>

    <section id="experience">
      <h2 class="section-title" data-section="experience"></h2>
      <div class="exp-list" id="experience-list"></div>
    </section>

    <section id="projects">
      <h2 class="section-title" data-section="projects"></h2>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <section id="publications">
      <h2 class="section-title" data-section="publications"></h2>
      <div class="exp-list" id="publications-list"></div>
    </section>

    <section id="coursework">
      <h2 class="section-title" data-section="coursework"></h2>
      <div class="coursework-grid" id="coursework-grid"></div>
    </section>
  </main>

  <div id="contact-modal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close">&times;</button>
      <h3 class="modal-title" id="contact-heading"></h3>
      <div class="modal-subtitle" id="contact-subtitle"></div>
      <div class="modal-body">
        <div class="contact-card-list" id="contact-list"></div>
      </div>
    </div>
  </div>

  <div id="project-modal" class="modal-overlay">
    <div class="modal-box">
      <button class="modal-close">&times;</button>
      <div id="project-modal-content"></div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p id="footer-text"></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
